<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>To-Do List</h1>
    <div class="controls">
      <input id="taskInput" type="text" placeholder="Новая задача">
      <button id="addTaskBtn">Добавить</button>
      <button id="clearCompletedBtn" class="secondary">Очистить выполненные</button>
    </div>

    <div class="filters">
      <button data-filter="all">Все</button>
      <button data-filter="active">Активные</button>
      <button data-filter="completed">Выполненные</button>
    </div>

    <p id="stats">Задач: 0 | Выполнено: 0</p>
    <ul id="taskList"></ul>
    <p id="message"></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
